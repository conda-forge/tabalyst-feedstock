schema_version: 1

context:
  version: "0.7.3"

package:
  name: tabalyst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tabalyst/tabalyst-${{ version }}.tar.gz
  sha256: 8b66a07f38a86a0aeb8383c7fd4dd4b9b1c72f6e6d6c9583dfd70152cc074d2a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tabalyst = tabalyst.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - python-duckdb ==1.5.5
    - ijson >=3.3
    - jinja2 >=3.1
    - platformdirs >=4
    - pydantic >=2.11
    - typer >=0.12
    - pyyaml >=6.0
    - python-calamine >=0.8
tests:
  - python:
      imports:
        - tabalyst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - tabalyst --help

about:
  summary: Open-source data profiling engine for structured JSON and customizable HTML reports.
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://tabalyst.com/
  repository: https://github.com/loribel-labs/tabalyst
  documentation: https://docs.tabalyst.com/

extra:
  recipe-maintainers:
    - HeavyTony2
