schema_version: 1

context:
  version: "0.7.5"

package:
  name: tabalyst
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tabalyst/tabalyst-${{ version }}.tar.gz
  sha256: 3b41951eeedd2c25d3d6fdceaf84a414d22486071e8cd14d0951d58841e81bc9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tabalyst = tabalyst.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }}
    - python-duckdb ==1.5.5
    - ijson >=3.3
    - jinja2 >=3.1
    - platformdirs >=4
    - pydantic >=2.11
    - typer >=0.12
    - pyyaml >=6.0
    - python-calamine >=0.8
tests:
  - python:
      imports:
        - tabalyst
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - tabalyst --help

about:
  summary: Open-source data profiling engine for structured JSON and customizable HTML reports.
  license: MPL-2.0
  license_file: LICENSE
  homepage: https://tabalyst.com/
  repository: https://github.com/loribel-labs/tabalyst
  documentation: https://docs.tabalyst.com/
  description: Tabalyst helps you understand CSV, Excel, JSON and JSONL datasets with minimal configuration. Detect missing values, duplicates, mixed types, data formats and quality issues. Generate interactive HTML reports and structured JSON profiles, entirely on your computer.

extra:
  recipe-maintainers:
    - HeavyTony2
